<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homeward · Nurse view</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --mute:#68707c; --line:#e3e6ea; --red:#c62828; --redbg:#fdecea;
          --amber:#9a6200; --amberbg:#fff4e0; --green:#1b7f3b; --blue:#1565c0; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; gap:16px; align-items:baseline; padding:14px 22px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:20px; margin:0; } header .meta { color:var(--mute); font-size:13px; }
  main { display:grid; grid-template-columns: minmax(260px,340px) minmax(340px,1fr) minmax(280px,380px); gap:16px; padding:16px 22px; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } .chat { height:60vh !important; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:16px; }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--mute); margin:0 0 10px; }
  label { display:block; font-size:13px; color:var(--mute); margin:8px 0 3px; }
  input, select, textarea { width:100%; font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:6px; }
  textarea { height:150px; font-size:12px; font-family:ui-monospace, Consolas, monospace; }
  button { font:inherit; padding:7px 12px; border-radius:6px; border:1px solid var(--blue); background:var(--blue); color:#fff; cursor:pointer; }
  button.ghost { background:#fff; color:var(--blue); }
  button:disabled { opacity:.5; cursor:wait; }
  .row { display:flex; gap:8px; align-items:center; margin-top:10px; }
  .alert { border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .alert.emergency { background:var(--redbg); border:1px solid var(--red); }
  .alert.nurse { background:var(--amberbg); border:1px solid var(--amber); }
  .alert .lvl { font-weight:700; text-transform:uppercase; font-size:12px; }
  .alert.emergency .lvl { color:var(--red); } .alert.nurse .lvl { color:var(--amber); }
  .alert .quote { font-style:italic; margin:4px 0; }
  .alert .small, .small { font-size:12px; color:var(--mute); }
  .pt { padding:8px 10px; border-radius:8px; cursor:pointer; border:1px solid transparent; }
  .pt.sel { border-color:var(--blue); background:#eef4fc; }
  .badge { display:inline-block; min-width:20px; padding:0 6px; border-radius:10px; background:var(--red); color:#fff; font-size:12px; text-align:center; }
  .chat { height:calc(100vh - 170px); overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
  .b { max-width:78%; padding:8px 12px; border-radius:16px; white-space:pre-wrap; }
  .b.in { align-self:flex-start; background:#e9e9eb; }
  .b.out { align-self:flex-end; background:#0b84ff; color:#fff; }
  .t { font-size:11px; color:var(--mute); }
  .t.in { align-self:flex-start; } .t.out { align-self:flex-end; }
  table { width:100%; border-collapse:collapse; font-size:13px; } td { padding:4px 4px; border-top:1px solid var(--line); vertical-align:top; }
  .chg { font-size:11px; padding:1px 5px; border-radius:4px; background:#eef4fc; color:var(--blue); }
  .chg.stopped { background:var(--redbg); color:var(--red); }
  ul { margin:4px 0 8px 18px; padding:0; }
  .ok { color:var(--green); } .bad { color:var(--red); }
  .empty { color:var(--mute); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Homeward</h1>
  <span class="meta" id="meta">loading…</span>
</header>
<main>
  <section>
    <div class="card" id="alerts"><h2>Alerts</h2><div class="empty">No open alerts.</div></div>
    <div class="card">
      <h2>Patients</h2>
      <div id="patients" class="empty">None enrolled yet.</div>
    </div>
    <div class="card">
      <h2>Enroll a patient</h2>
      <label>Name</label><input id="f-name" value="Maria Alvarez">
      <label>Patient's phone (iMessage) or Apple ID email</label><input id="f-handle" placeholder="+1 609 555 0100">
      <label>Language for messages</label>
      <select id="f-lang"><option>English</option><option>Spanish</option><option>Croatian</option><option>Chinese (Simplified)</option><option>Haitian Creole</option></select>
      <label>Discharge letter</label><textarea id="f-letter" placeholder="Paste the discharge summary"></textarea>
      <div class="row">
        <button id="f-go">Make plan and enroll</button>
        <button class="ghost" id="f-sample">Use sample letter</button>
      </div>
      <div class="small" id="f-status"></div>
    </div>
  </section>

  <section class="card">
    <h2 id="chat-title">Conversation</h2>
    <div class="chat" id="chat"><div class="empty">Select a patient.</div></div>
  </section>

  <section>
    <div class="card" id="plan"><h2>Plan</h2><div class="empty">Select a patient.</div></div>
  </section>
</main>
<script>
let sel = null, last = null, chatLen = -1;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const time = iso => new Date(iso).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});

async function refresh() {
  try { last = await (await fetch("/api/state")).json(); } catch { return; }
  $("meta").textContent = `channel: ${last.channel === "photon" ? "Photon 2.0 (iMessage" + (last.agent_handle ? " " + last.agent_handle : "") + ")" : "local stub, open /phone"} · model: ${last.model}`;
  if (!sel && last.patients.length) sel = last.patients[0].id;
  render();
}

function render() {
  const pts = last.patients;
  // alerts across all patients
  const open = pts.flatMap(p => p.escalations.filter(e => !e.acknowledged).map(e => ({...e, name:p.name})));
  $("alerts").innerHTML = "<h2>Alerts</h2>" + (open.length ? open.map(e => `
    <div class="alert ${e.level}">
      <div class="lvl">${e.level === "emergency" ? "Emergency" : "Call patient"} · ${esc(e.name)}</div>
      <div class="quote">"${esc(e.message)}"</div>
      <div>${esc(e.reason)}</div>
      <div class="row"><span class="small">${time(e.created_at)} · flagged by ${e.source === "rule" ? "fixed rule" : "Claude"}</span>
      <button class="ghost" onclick="ack(${e.id})">Handled</button></div>
    </div>`).join("") : `<div class="empty">No open alerts.</div>`);

  $("patients").innerHTML = pts.length ? pts.map(p => {
    const n = p.escalations.filter(e => !e.acknowledged).length;
    const tb = p.teachback.length ? `${p.teachback.filter(t => t.correct).length}/${p.teachback.length} teach-back` : "no teach-back yet";
    return `<div class="pt ${p.id === sel ? "sel" : ""}" onclick="sel=${p.id};chatLen=-1;render()">
      <b>${esc(p.name)}</b> ${n ? `<span class="badge">${n}</span>` : ""}<br>
      <span class="small">${esc(p.handle)} · ${esc(p.language)} · day ${p.day} · ${tb}</span></div>`;
  }).join("") : `<div class="empty">None enrolled yet.</div>`;

  const p = pts.find(p => p.id === sel);
  if (!p) return;
  $("chat-title").innerHTML = `Conversation · ${esc(p.name)} <button class="ghost" style="float:right;font-size:12px" onclick="checkin(${p.id})">Send day ${p.day + 1} check-in</button>`;
  if (p.messages.length !== chatLen) {
    chatLen = p.messages.length;
    $("chat").innerHTML = p.messages.length ? p.messages.map(m =>
      `<div class="b ${m.direction}">${esc(m.text)}</div><div class="t ${m.direction}">${m.direction === "in" ? "patient" : "Homeward"} · ${time(m.created_at)}</div>`).join("")
      : `<div class="empty">Waiting for ${esc(p.name)} to text the line. Shared iMessage lines cannot send the first message.</div>`;
    $("chat").scrollTop = 1e9;
  }
  const pl = p.plan;
  $("plan").innerHTML = `<h2>Plan · ${esc(p.name)}</h2>
    <div>${esc(pl.diagnosis_plain)}</div>
    <h2 style="margin-top:12px">Medications</h2>
    <table>${pl.medications.map(m => `<tr><td><b>${esc(m.name)}</b> ${esc(m.dose)}<br><span class="small">${esc(m.when)} · ${esc(m.purpose)}</span></td>
      <td>${m.change !== "same" ? `<span class="chg ${m.change}">${m.change}</span>` : ""}</td></tr>`).join("")}</table>
    <h2 style="margin-top:12px">Daily checks</h2><ul>${pl.daily_checks.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
    <h2>Call 911 if</h2><ul>${pl.call_911_if.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
    <h2>Call the nurse if</h2><ul>${pl.call_nurse_if.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
    ${pl.weight_gain_alert_lb ? `<div class="small">Fixed rule: alert at ${pl.weight_gain_alert_lb} lb gain</div>` : ""}
    <h2 style="margin-top:12px">Follow-up</h2><ul>${pl.follow_up.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
    <h2>Teach-back</h2><ul>${pl.teach_back.map(t => {
      const r = p.teachback.filter(x => x.question.trim().toLowerCase() === t.question.trim().toLowerCase()).pop();
      return `<li>${esc(t.question)} ${r ? (r.correct ? '<b class="ok">understood</b>' : '<b class="bad">needs review</b>') : '<span class="small">not asked yet</span>'}</li>`;
    }).join("")}</ul>
    ${p.teachback.length ? `<h2>Teach-back answers</h2><ul>${p.teachback.map(t => `<li class="${t.correct ? "ok" : "bad"}">${esc(t.question)}<br><span class="small">"${esc(t.answer)}"</span></li>`).join("")}</ul>` : ""}`;
}

async function ack(id) { await fetch(`/api/escalations/${id}/ack`, {method:"POST"}); refresh(); }

async function checkin(id) {
  const r = await fetch(`/api/patients/${id}/checkin`, {method:"POST"});
  if (!r.ok) alert((await r.json()).detail);
  refresh();
}

$("f-sample").onclick = async () => {
  const s = await (await fetch("/api/samples")).json();
  $("f-letter").value = Object.values(s)[0] || "";
};
$("f-go").onclick = async () => {
  const body = { name:$("f-name").value, handle:$("f-handle").value, language:$("f-lang").value, letter:$("f-letter").value };
  if (!body.handle || !body.letter) { $("f-status").textContent = "Phone and letter are required."; return; }
  $("f-go").disabled = true; $("f-status").textContent = "Claude is reading the letter (about 20-40 s)…";
  const r = await fetch("/api/patients", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body)});
  $("f-go").disabled = false;
  if (!r.ok) { $("f-status").textContent = "Failed: " + (await r.text()); return; }
  const j = await r.json(); sel = j.id; chatLen = -1;
  $("f-status").textContent = "Enrolled. Ask the patient to text the Homeward number.";
  refresh();
};
refresh(); setInterval(refresh, 1500);
</script>
</body>
</html>
