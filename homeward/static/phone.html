<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homeward · Stub phone</title>
<style>
  body { margin:0; font:15px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; background:#ddd; display:flex; justify-content:center; }
  .phone { width:390px; height:100vh; max-height:820px; background:#fff; display:flex; flex-direction:column; margin-top:10px; border-radius:24px; overflow:hidden; box-shadow:0 4px 20px #0003; }
  .top { padding:10px 14px; border-bottom:1px solid #eee; font-size:13px; color:#555; }
  .top input { width:100%; padding:5px 8px; border:1px solid #ddd; border-radius:6px; font:inherit; margin-top:4px; }
  .note { font-size:11px; color:#a00; margin-top:4px; }
  .msgs { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:6px; }
  .b { max-width:80%; padding:8px 12px; border-radius:18px; white-space:pre-wrap; }
  .me { align-self:flex-end; background:#0b84ff; color:#fff; }
  .them { align-self:flex-start; background:#e9e9eb; }
  .typing { align-self:flex-start; color:#888; font-size:12px; }
  form { display:flex; gap:6px; padding:10px; border-top:1px solid #eee; }
  form input { flex:1; padding:9px 12px; border:1px solid #ccc; border-radius:18px; font:inherit; }
  form button { border:0; background:#0b84ff; color:#fff; border-radius:18px; padding:0 14px; font:inherit; }
</style>
</head>
<body>
<div class="phone">
  <div class="top">Patient's phone (local stub, not a real iMessage)
    <input id="handle" placeholder="Patient phone as enrolled, e.g. +16095550100">
  </div>
  <div class="msgs" id="msgs"></div>
  <form id="f"><input id="t" placeholder="Text Message" autocomplete="off"><button>Send</button></form>
</div>
<script>
const $ = id => document.getElementById(id);
$("handle").value = localStorage.getItem("hw-handle") || "";
let pending = false;
function norm(h) { const d = h.replace(/\D/g, ""); return h.includes("@") ? h.toLowerCase() : (h.trim().startsWith("+") ? "+" + d : d.length === 10 ? "+1" + d : "+" + d); }
async function refresh() {
  const s = await (await fetch("/api/state")).json();
  const p = s.patients.find(p => p.handle === norm($("handle").value));
  const msgs = p ? p.messages : [];
  if (msgs.length && msgs[msgs.length - 1].direction === "out") pending = false;
  $("msgs").innerHTML = msgs.map(m => `<div class="b ${m.direction === "in" ? "me" : "them"}">${m.text.replace(/[&<]/g, c => c === "&" ? "&amp;" : "&lt;")}</div>`).join("")
    + (pending ? `<div class="typing">Homeward is typing…</div>` : "");
  $("msgs").scrollTop = 1e9;
}
$("f").onsubmit = async e => {
  e.preventDefault();
  const text = $("t").value.trim(); if (!text) return;
  localStorage.setItem("hw-handle", $("handle").value);
  $("t").value = ""; pending = true;
  const r = await fetch("/stub/send", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({handle:$("handle").value, text})});
  if (!r.ok) alert((await r.json()).detail);
  refresh();
};
refresh(); setInterval(refresh, 1000);
</script>
</body>
</html>
